name: check

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: main tests
        run: ./scripts/test.sh

      - name: sudo tests
        run: sudo ./scripts/test.sh

      - name: lint
        run: |
          sudo apt-get install shellcheck
          ./scripts/lint.sh
